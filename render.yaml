# Render Blueprint for the API + Postgres half of the deploy (docs/DEPLOY.md).
# The client (Vercel) isn't part of this blueprint — Vercel isn't a Render
# concept. Apply via the Render dashboard: New -> Blueprint -> this repo.
#
# databases: pathway-db already exists (created via `render postgres create`
# before this blueprint was written) and is referenced by name below via
# fromDatabase, not redeclared here, so applying this blueprint won't try to
# recreate it.
services:
  - type: web
    name: pathway-api
    runtime: node
    rootDir: server
    plan: free
    buildCommand: npm install
    # Applies pending migrations, seeds (safe to re-run — prisma:seed
    # upserts), then starts the server. This has to live in startCommand,
    # not preDeployCommand — Render's pre-deploy step is paid-plan-only
    # ("Predeploy command not run. Commands can only run on paid instance
    # types" on the free plan this app deploys on) — simplest viable
    # approach for a low-traffic personal app on the free tier (see
    # docs/DEPLOY.md's caveat about a real production setup using a
    # separate release step instead, which would need a paid plan here).
    startCommand: npx prisma migrate deploy && npm run prisma:seed && npm start
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: pathway-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGIN
        value: https://pathway-for-studies.vercel.app
