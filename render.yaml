# Render Blueprint for the API + Postgres half of the deploy (docs/DEPLOY.md).
# The client (Vercel) isn't part of this blueprint — Vercel isn't a Render
# concept. Apply via the Render dashboard: New -> Blueprint -> this repo.
#
# databases: pathway-db already exists (created via `render postgres create`
# before this blueprint was written) and is referenced by name below via
# fromDatabase, not redeclared here, so applying this blueprint won't try to
# recreate it.
services:
  - type: web
    name: pathway-api
    runtime: node
    rootDir: server
    plan: free
    buildCommand: npm install
    # Applies pending migrations, then starts the server — simplest approach
    # for a low-traffic personal app (see docs/DEPLOY.md's caveat about a
    # real production setup using a separate release step instead).
    startCommand: npx prisma migrate deploy && npm start
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: pathway-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      # Placeholder until the Vercel client is deployed — update this to the
      # real Vercel URL afterward (docs/DEPLOY.md step 3), then redeploy.
      - key: CORS_ORIGIN
        value: https://placeholder.vercel.app
